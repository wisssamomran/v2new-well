<!DOCTYPE html>
<html>
<head>

  <title>Logo SVG Preview</title>

</head>
<body>
  <div class="card">
    <h3>Original Recreated SVG (Light)</h3>

      <path
        d="M 54 74 L 88 44 L 134 76 L 126 84 L 88 56 L 62 82 Z"

      />

      <!-- Building 1 (Left Skyscraper) -->

        d="M 64 88 L 82 76 L 82 144 L 64 144 Z"

        d="M 146 102 C 140 102 135 107 135 113 C 135 119 143 128 146 132 C 149 128 157 119 157 113 C 157 107 152 102 146 102 Z"

  </div>
</body>
</html>
